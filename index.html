<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wheel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #faf5f8;
  overflow: hidden;
}

.app {
  display: flex;
  align-items: center;
  gap: 80px;
}

.wheel-container { position: relative; }

canvas {
  width: 650px;
  height: 650px;
  border-radius: 50%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  cursor: pointer;
}

.pointer {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 26px solid black;
  z-index: 10;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

textarea {
  width: 260px;
  height: 300px;
  border-radius: 10px;
  border: 1px solid #ccc;
  padding: 10px;
}

button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #ec4899;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

.panel.hidden {
  opacity: 0;
  pointer-events: none;
}

/* MODAL WITH DIM */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.4);
}

.modal-content {
  background: white;
  padding: 40px;
  border-radius: 16px;
  text-align: center;
  z-index: 20;
}

.winner-name {
  font-size: 40px;
  font-weight: 900;
  color: #ec4899;
  margin-bottom: 20px;
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 12px;
}

/* BURST ANIMATION */
@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="650" height="650"></canvas>
  </div>

  <div id="panel" class="panel">
    <textarea id="names">Alice
Bob
Charlie
Daisy</textarea>

    <button onclick="shuffleNames()">Shuffle</button>
    <button onclick="sortNames()">Sort A-Z</button>
    <button onclick="openSettings()">Settings</button>

    <label>
      <input type="checkbox" id="hideDuringSpin"> Hide panel during spin
    </label>
  </div>

</div>

<div id="winnerModal" class="modal">
  <div class="modal-content">
    <div id="winnerText" class="winner-name"></div>
    <button onclick="closeWinner()">Close</button>
  </div>
</div>

<div id="settingsModal" class="modal">
  <div class="modal-content">
    <div id="rigUI" style="display:none;">
      <select id="rigSelect" style="width:100%; padding:8px;"></select>
    </div>
    <br>
    <button onclick="closeSettings()">Close</button>
  </div>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const panel = document.getElementById("panel");

let entries = [];
let spinning = false;
let rigEnabled = false;

/* AUDIO */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/* SOFTER TICK */
function playTick() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = 700;
  gain.gain.value = 0.08;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  osc.stop(audioCtx.currentTime + 0.04);
}

/* WIN SOUND */
function playWinSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = 600;
  gain.gain.value = 0.3;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.stop(audioCtx.currentTime + 0.4);
}

document.addEventListener("click", () => audioCtx.resume(), { once: true });

const colors = ["#ec4899","#f472b6","#db2777","#be185d","#f9a8d4"];

function getEntries() {
  return document.getElementById("names").value
    .split("\n").map(e => e.trim()).filter(e => e);
}

function updateRigDropdown() {
  const select = document.getElementById("rigSelect");
  select.innerHTML = "";
  getEntries().forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
}

function openSettings() {
  updateRigDropdown();
  document.getElementById("settingsModal").style.display = "flex";
}

function closeSettings() {
  document.getElementById("settingsModal").style.display = "none";
}

function shuffleNames() {
  const arr = getEntries();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  document.getElementById("names").value = arr.join("\n");
  drawWheel();
}

function sortNames() {
  const arr = getEntries().sort((a,b)=>a.localeCompare(b));
  document.getElementById("names").value = arr.join("\n");
  drawWheel();
}

function drawWheel() {
  entries = getEntries();
  ctx.clearRect(0,0,650,650);

  const arc = (2*Math.PI)/entries.length;

  entries.forEach((name,i)=>{
    const angle = i*arc;

    ctx.beginPath();
    ctx.moveTo(325,325);
    ctx.arc(325,325,325,angle,angle+arc);
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();

    ctx.save();
    ctx.translate(325,325);
    ctx.rotate(angle + arc/2);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "700 18px Inter";
    ctx.fillText(name,260,5);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(325,325,70,0,2*Math.PI);
  ctx.fillStyle = "white";
  ctx.fill();
}

/* CONFETTI BURST */
function createConfetti() {
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  for (let i = 0; i < 60; i++) {
    const div = document.createElement("div");
    div.className = "confetti";

    div.style.left = centerX + "px";
    div.style.top = centerY + "px";

    const angle = Math.random() * 2 * Math.PI;
    const distance = Math.random() * 400 + 100;

    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;

    div.style.background = ["#ec4899","#f472b6","#f9a8d4"][Math.floor(Math.random()*3)];
    div.style.animation = "explode 1s ease-out forwards";

    div.style.setProperty("--x", x + "px");
    div.style.setProperty("--y", y + "px");

    document.body.appendChild(div);
    setTimeout(()=>div.remove(),1000);
  }
}

function openWinner(name) {
  document.getElementById("winnerText").innerText = name;
  document.getElementById("winnerModal").style.display = "flex";
  createConfetti();
}

function closeWinner() {
  document.getElementById("winnerModal").style.display = "none";
}

function spinWheel() {
  if (spinning) return;

  entries = getEntries();
  if (!entries.length) return;

  spinning = true;

  if (document.getElementById("hideDuringSpin").checked) {
    panel.classList.add("hidden");
  }

  let winner = rigEnabled
    ? document.getElementById("rigSelect").value
    : entries[Math.floor(Math.random()*entries.length)];

  const index = entries.indexOf(winner);
  const segmentAngle = 360 / entries.length;

  let current = 0;
  let lastSegment = -1;
  const target = 360*6 + (270 - (index*segmentAngle + segmentAngle/2));

  function animate() {
    current += (target - current) * 0.045;

    const seg = Math.floor((current % 360) / segmentAngle);
    if (seg !== lastSegment) {
      playTick();
      lastSegment = seg;
    }

    canvas.style.transform = `rotate(${current}deg)`;

    if (Math.abs(current - target) < 0.5) {
      canvas.style.transform = `rotate(${target}deg)`;

      playWinSound();
      openWinner(winner);

      spinning = false;
      panel.classList.remove("hidden");
      return;
    }

    requestAnimationFrame(animate);
  }

  animate();
}

/* SECRET COMBO */
let seq = [];
document.addEventListener("keydown", (e) => {
  seq.push(e.key.toLowerCase());
  if (seq.length > 2) seq.shift();

  if (seq[0] === "c" && seq[1] === "4") {
    rigEnabled = !rigEnabled;
    document.getElementById("rigUI").style.display = rigEnabled ? "block" : "none";
    updateRigDropdown();
    seq = [];
  }
});

canvas.addEventListener("click", spinWheel);
document.getElementById("names").addEventListener("input", drawWheel);

drawWheel();
</script>

</body>
</html>
